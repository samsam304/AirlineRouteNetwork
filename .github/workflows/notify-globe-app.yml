name: Notify globe app of source change

# When this repo's main branch changes, ping DomBarker99/airline-route-globe
# so it re-runs its data export and refreshes nodes.json / edges.json.
# That repo's refresh-data.yml accepts repository_dispatch events of type
# "source-updated" and short-circuits if the regenerated JSON is identical,
# so a noisy push (README edits, etc.) costs ~20s of runner time and zero
# commits there.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger refresh in airline-route-globe
        env:
          GH_TOKEN: ${{ secrets.GLOBE_APP_DISPATCH_TOKEN }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/DomBarker99/airline-route-globe/dispatches \
            -d '{"event_type":"source-updated"}'
